<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Instahyre</title>
    <link rel="icon" type="image/x-icon" href="/favicon-new-ui.ico">
    <link rel="stylesheet" type="text/css" href="/static/new-static/fonts/fonts.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Gilroy';
            background: #f6f7f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .bg-circle {
            position: absolute;
            top: calc(50% + 10px);
            left: calc(50% - 3px);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid #eaedf0;
            pointer-events: none;
        }
        .bg-circle-1 { width: 640px; height: 640px; }
        .bg-circle-2 { width: 860px; height: 860px; }
        .bg-dot-gradient,
        .bg-triangle,
        .bg-star,
        .bg-star-right,
        .bg-diamond {
            position: absolute;
            z-index: 5;
            pointer-events: none;
        }
        .bg-dot-gradient {
            top: calc(50% + 19px);
            left: calc(50% - 334px);
        }
        .bg-triangle {
            top: 15%;
            left: 5%;
        }
        .bg-star {
            top: calc(50% + 266px);
            left: calc(50% - 497px);
        }
        .bg-star-right {
            top: calc(50% - 102px);
            left: calc(50% + 280px);
            width: 48px;
            height: 47px;
        }
        .bg-diamond {
            top: calc(50% + 17px);
            left: calc(50% + 467px);
        }
        .card {
            width: 419px;
            height: 336px;
            max-width: calc(100vw - 30px);
            padding: 32px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            position: relative;
            z-index: 10;
            overflow: hidden;
            background: white;
            border: 1px solid #eaedf0;
            border-radius: 12px;
            box-shadow: 4px 4px 32px 0 rgba(74, 80, 86, 0.1);
        }
        .maintenance-animation {
            width: 258px;
            height: 123px;
            flex: 0 0 123px;
            display: block;
            border: 0;
        }
        .logo {
            display: flex;
            flex: 0 0 36px;
            line-height: 0;
        }
        .logo img {
            display: block;
            width: auto;
            height: 36px;
        }
        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }
        .title {
            color: #30353c;
            font-size: 23px;
            font-weight: 600;
            line-height: 29.9px;
        }
        .updating-pill {
            padding: 2px 10px;
            color: #029a82;
            background: #e5f9f1;
            border-radius: 50px;
            font-size: 23px;
            font-weight: 600;
            line-height: 29.9px;
        }
        .subtitle {
            color: #6c737d;
            font-size: 14px;
            font-weight: 600;
            line-height: 22.5px;
            text-align: center;
            white-space: nowrap;
        }
        @media (max-width: 768px) {
            .bg-circle {
                top: 50%;
                left: calc(50% - 5.5px);
            }
            .bg-circle-1 { width: 283px; height: 283px; }
            .bg-circle-2 { width: 380px; height: 380px; }
            .bg-dot-gradient {
                top: calc(50% + 4px);
                left: 43px;
                width: 11px;
                height: 11px;
            }
            .bg-triangle {
                top: calc(50% - 128px);
                left: 36px;
                width: 16px;
                height: 15px;
            }
            .bg-star {
                top: calc(50% + 115px);
                left: 43px;
                width: 20px;
                height: 20px;
            }
            .bg-star-right {
                top: calc(50% - 50px);
                left: calc(50% + 119px);
                width: 21px;
                height: 21px;
            }
            .bg-diamond {
                top: calc(50% + 3px);
                left: calc(100% - 29px);
                width: 33px;
                height: 28px;
            }
            .card {
                width: 360px;
                height: 331px;
                padding: 31px 50px;
            }
            .title,
            .updating-pill {
                font-size: 21px;
                line-height: 27.3px;
            }
            .subtitle {
                font-size: 13px;
                font-weight: 500;
                line-height: 19.5px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <img class="bg-dot-gradient" src="/static/new-static/images/maintenance/cirlce.svg" alt="" width="25" height="25">
    <img class="bg-triangle" src="/static/new-static/images/maintenance/triangle.svg" alt="" width="36" height="33">
    <img class="bg-star" src="/static/new-static/images/maintenance/star%202.svg" alt="" width="42" height="42">
    <img class="bg-star-right" src="/static/new-static/images/maintenance/start.svg" alt="" width="41" height="42">
    <img class="bg-diamond" src="/static/new-static/images/maintenance/diamond.svg" alt="" width="74" height="63">
    <div class="card">
        <iframe class="maintenance-animation" src="/static/new-static/documents/maintenance-animation.html" title="Server update animation" scrolling="no"></iframe>
        <div class="logo">
            <a href="/">
                 <img src="/static/new-static/images/logo-dark.webp" alt="Instahyre">
            </a>
        </div>
        <div class="title-container">
            <div class="title-row">
                <span class="title">We are</span>
                <span class="updating-pill">updating</span>
                <span class="title">our servers</span>
            </div>
            <p class="subtitle">Please refresh the page after a few minutes</p>
        </div>
    </div>

</body></html>
